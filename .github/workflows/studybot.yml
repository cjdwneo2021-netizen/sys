name: StudyBot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: studybot-main
  cancel-in-progress: false
jobs:
  organize:
    if: vars.STUDYBOT_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'gemini' }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MAX_MODEL_CALLS: ${{ vars.MAX_MODEL_CALLS || '8' }}
      MAX_DAILY_MODEL_CALLS: ${{ vars.MAX_DAILY_MODEL_CALLS || '32' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install .
      - name: Authenticate read-only Drive access
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          create_credentials_file: false
      - name: Import stable lecture snapshots
        id: sync
        timeout-minutes: 15
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: studybot sync
      - name: Build notes and memory
        if: steps.sync.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
        run: studybot build
      - name: Save results and resumable checkpoints
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in materials notes memory state downloads README.md; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "studybot: update lecture notes and checkpoints"
          git push origin "HEAD:$TARGET_BRANCH"
